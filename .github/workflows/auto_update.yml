name: 🚀 每日台股盤後全自動分析與更新

on:
  schedule:
    # 台灣時間 每週一至週五 下午 14:45 (UTC 06:45)
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊一鍵立即執行

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式庫代碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ 執行全市場 2,400+ 檔台股多頭掃描與分析
        run: |
          python scripts/cloud_update.py

      - name: 📤 自動提交並推送最新行情數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wwwroot/js/market_data.js js/market_data.js Data/market_snapshot.json
          git commit -m "🤖 自動更新盤後即時選股數據 [$(date +'%Y-%m-%d %H:%M')]" || echo "今日數據已是最新，無需更新"
          git push origin main
